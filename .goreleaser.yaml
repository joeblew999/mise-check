# The mise-check binary for every machine, on each release (.github/workflows/release.yml); a repo pins it with
# mise use github:joeblew999/mise-check@<version>.
version: 2
project_name: mise-check
builds:
  - id: mise-check
    main: ./cmd/mise-check
    binary: mise-check
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
checksum:
  name_template: checksums.txt
release:
  github:
    owner: joeblew999
    name: mise-check
# Each release lists every commit since the previous tag, each with its link and author, so a person or
# an agent can see what changed with `gh release view <tag>`. "github" goes by commits, not pull requests: most changes
# here go straight to main, so GitHub's own PR-based notes would be nearly empty.
changelog:
  use: github
  abbrev: 7
  filters:
    exclude:
      - "^Merge "
