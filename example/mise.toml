# greet's repo's own tasks, only for working on greet: run them here, at its top (in mise-check, example/). A repo that
# uses greet never gets this file: go tool greet init writes the template's tool half, templates/'s. Each task is named for
# what it acts on (noun:verb):
#   template: the template, templates/, a whole repo that runs where it is
#     mise run template:e2e          TestWalk on it: its numbered tasks in their order, through its own mise file, each checked
#     mise run template:check-mise   misecheck on its tasks file against greet's Go, and against the walk that runs them
#   new-repo: a new repo, made from nothing as docs/greet/README.md says, by the walk and gone after it
#     mise run new-repo:e2e          TestWalk on it, made at this checkout
#   tool: greet itself, its command and its module
#     mise run tool:test             go vet, and its Go tests (none of them walk)
#   root: this file
#     mise run root:check-mise       misecheck on this very file
# The example isn't released or built on its own: it shows mise-check's Go (misecheck, walk) and a mise file together.

[settings]
# go.mod's toolchain line is the Go pin; this makes mise install honour it.
idiomatic_version_file_enable_tools = ["go"]

[tasks."template:e2e"]
description = "TestWalk on the template, templates/, where it is: its numbered tasks (greet:03-init to 07-bye) in their order, through its own mise file, each checked by what a person would see it do (walk_test.go)"
env = { REPO_PATH = "templates" }
run = 'go test . -run "^TestWalk$" -count=1 -v -timeout 10m'

[tasks."template:check-mise"]
description = "misecheck on the template's tasks file, both ways: against greet's Go (each task's command is its file, each command file is a task's, each flag on both sides) and against the walk that runs them (each task it names is one)"
env = { MISE_FILE = "templates/.mise/tasks/greet.toml", GO_CMD = "cmd", GO_LAYOUT = "file", GO_CALLERS = "." }
run = 'go test . -run "^TestMise$" -count=1 -v'

[tasks."new-repo:e2e"]
description = "TestWalk on a new repo, made from nothing as docs/greet/README.md says (an empty folder with its own git, go mod init, greet's tool line, go tool greet init, greet:template), at this checkout; gone after it"
env = { REPO_PATH = "templates", E2E_STAMPED = "true" }
run = 'go test . -run "^TestWalk$" -count=1 -v -timeout 10m'

[tasks."tool:test"]
description = "go vet, and greet's Go tests, run for real (no cached results): none of them walk, so they need nothing"
run = 'go vet ./... && go test -count=1 ./...'

[tasks."root:check-mise"]
description = "misecheck on this very file: each task one line, its Go there, its usage passed by name, no POSIX shell syntax"
env = { MISE_FILE = "mise.toml" }
run = 'go test . -run "^TestMise$" -count=1 -v'
