# mise-check's own tasks, only for working on mise-check itself: run them here, at the top. A repo that uses mise-check
# gets nothing from this file, nor any mise at all: it imports the Go module, go get github.com/joeblew999/mise-check.
#   mise run lib:test          go vet, and the tests of the checker, the walk and the example (none of them walk)
#   mise run lib:check-mise    misecheck on this very file: the repo uses itself as any repo does
#   mise run example:check     the example, example/: misecheck on both its mise files, then its walk, on the template
#                              where it is and on a new repo made from nothing
# The example's own tasks are in its own mise file, example/mise.toml: run them there.

[settings]
# go.mod's toolchain line is the Go pin; this makes mise install honour it.
idiomatic_version_file_enable_tools = ["go"]

[tasks."lib:test"]
description = "go vet, and the tests of the checker (what it reads of a mise file, how it reads a run line, the example broken nine ways), the walk, and the example (none of them walk)"
run = 'go vet ./... && go test ./... -count=1'

[tasks."lib:check-mise"]
description = "misecheck on this repo's own mise.toml, the file this task is in: each task one line, the Go it runs there, its usage passed by name, no POSIX shell syntax, so every task here runs on Windows too"
env = { MISE_FILE = "mise.toml" }
run = 'go test . -run "^TestMise$" -count=1 -v'

[tasks."example:check"]
description = "The example, example/, through its own mise file: misecheck on that file and on its template's tasks, then its walk on the template where it is and on a new repo made from nothing"
dir = "example"
run = 'mise run root:check-mise && mise run template:check-mise && mise run template:e2e && mise run new-repo:e2e'
