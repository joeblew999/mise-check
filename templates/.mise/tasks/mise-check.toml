# This repo's pins and mise tasks, with mise-check. Start with: mise run mise-check (what's done, and what to run next).
# One task per command: mise run mise-check:<command> runs mise-check <command>.
# Each passes its usage values with mise's own templates ({{usage.<name>}}), never shell syntax, so it runs the same
# under sh, cmd and PowerShell.
# Written by mise-check (github.com/joeblew999/mise-check): don't edit it. .mise/config.toml pins its version.

["mise-check"]
description = "Start here: what's done for this repo, and what to run next (mise run mise-check:show-help: every command)"
usage = 'flag "--json" help="one JSON document on stdout, instead of text"'
run = 'mise-check{% if usage.json %} --json{% endif %}'

["mise-check:init"]
description = "mise-check's files written into the repo again, after upgrading it (the first time, before these tasks: mise exec github:joeblew999/mise-check@latest -- mise-check init)"
run = "mise-check init"

["mise-check:check"]
description = "The repo's rules: its own mise files by misecheck (each task one line, its usage passed by name, no POSIX shell syntax, so it runs the same on macOS, Linux and Windows), init's files current, and .mise/config.toml pinning mise-check"
usage = 'flag "--json" help="one JSON document on stdout, instead of text"'
run = 'mise-check check{% if usage.json %} --json{% endif %}'

["mise-check:show"]
description = "What's done for this repo, and what to run next"
usage = 'flag "--json" help="one JSON document on stdout, instead of text"'
run = 'mise-check show{% if usage.json %} --json{% endif %}'

["mise-check:update"]
description = "Every pin at its newest release, in one go: update-mise, update-packages and update-go, in that order. It ends with every pin, the moved ones before → after; git diff shows them, then mise run mise-check:verify proves them (a major move can break)"
usage = 'flag "--no-major" help="no major moves: packages within their ranges, Go modules within their major"; flag "--json" help="one JSON document on stdout, every pin before and after, instead of text"'
run = 'mise-check update{% if usage.no_major %} --no-major{% endif %}{% if usage.json %} --json{% endif %}'

["mise-check:update-mise"]
description = "The mise tools at their newest releases, in the repo's mise files (mise upgrade --bump), mise-check's own pin among them, and nothing else"
usage = 'flag "--no-major" help="no major moves: packages within their ranges, Go modules within their major"; flag "--json" help="one JSON document on stdout, every pin before and after, instead of text"'
run = 'mise-check update-mise{% if usage.no_major %} --no-major{% endif %}{% if usage.json %} --json{% endif %}'

["mise-check:update-packages"]
description = "The Node packages at their newest releases, package.json and whichever lockfile the repo has (aube update, aube pinned in the repo's mise), and nothing else"
usage = 'flag "--no-major" help="no major moves: packages within their ranges, Go modules within their major"; flag "--json" help="one JSON document on stdout, every pin before and after, instead of text"'
run = 'mise-check update-packages{% if usage.no_major %} --no-major{% endif %}{% if usage.json %} --json{% endif %}'

["mise-check:update-go"]
description = "Go at its newest, in every go.mod: its toolchain line, and its modules, majors too, their import paths rewritten (go mod tidy, go-mod-upgrade, go mod tidy), and nothing else"
usage = 'flag "--no-major" help="no major moves: packages within their ranges, Go modules within their major"; flag "--json" help="one JSON document on stdout, every pin before and after, instead of text"'
run = 'mise-check update-go{% if usage.no_major %} --no-major{% endif %}{% if usage.json %} --json{% endif %}'

["mise-check:show-users"]
description = "Which of the owner's repos on GitHub use this one: its Go module in their go.mod, its binary in their mise files, at the versions each pins, against the newest release, the behind ones marked. Needs a token for private repos (GITHUB_TOKEN, GH_TOKEN, or gh's login)"
usage = 'flag "--json" help="one JSON document on stdout, instead of text"'
run = 'mise-check show-users{% if usage.json %} --json{% endif %}'

["mise-check:verify"]
description = "What the repo's GitHub workflow runs: each pin consistent with what pins it (the packages with their lockfile, aube install --frozen-lockfile; every go.mod with its code, go mod tidy -diff), its own setup and test tasks if it has them, then check. The same here as on GitHub"
run = "mise-check verify"

["mise-check:template"]
description = "The template's little app, in a repo with no Go program yet: app/, the mise.toml that runs and tests it, and README.md named for the repo's folder. It never writes over a file"
run = "mise-check template"

["mise-check:show-version"]
description = "This mise-check's version"
usage = 'flag "--json" help="one JSON document on stdout, instead of text"'
run = 'mise-check show-version{% if usage.json %} --json{% endif %}'

["mise-check:show-help"]
description = "Every command"
run = "mise-check show-help"
